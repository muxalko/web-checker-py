[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "web-checker"
version = "0.1.0"
description = "Extensible scheduled availability checker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.15,<5",
  "Flask>=3.1,<4",
  "httpx>=0.28,<0.29",
  "PyYAML>=6.0.3,<7",
]

[project.scripts]
web-checker = "web_checker.cli:main"

[project.optional-dependencies]
dev = [
  "pre-commit>=4.6,<5",
  "pytest>=9.1,<10",
  "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
include = ["mock_site*", "web_checker*"]

[tool.pytest.ini_options]
addopts = "-ra"
cache_dir = "/tmp/web-checker-pytest-cache"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
cache-dir = "/tmp/web-checker-ruff-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
