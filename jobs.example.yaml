jobs:
  - id: mock-adventure-passes
    enabled: true
    driver: generic_html
    notify:
      channels:
        - console
      on:
        - became_available
    schedule:
      interval_seconds: 60
      retry:
        max_attempts: 3
        initial_delay_seconds: 5
        max_delay_seconds: 60
        jitter_fraction: 0.2
    config:
      url: http://mock-site:8080/reservations/2026-08-22
      timeout_seconds: 5
      max_response_bytes: 262144
      parser:
        opportunity_selector: "[data-opportunity-id]"
        id:
          attribute: data-opportunity-id
        title:
          selector: ".title"
        availability:
          selector: ".status"
          attribute: data-status
        availability_mapping:
          available: available
          sold-out: unavailable
          unknown: unknown
        starts_at:
          selector: time
          attribute: datetime
        booking_url:
          selector: "a.book"
          attribute: href
          required: false
        attributes:
          capacity:
            selector: ".status"
            attribute: data-capacity
            required: false
