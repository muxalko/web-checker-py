minimum_pre_commit_version: "4.6.0"

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        alias: gitleaks-staged
        name: Detect secrets in staged changes
      - id: gitleaks
        alias: gitleaks-history
        name: Detect secrets in repository history
        entry: gitleaks git --redact --verbose --no-banner .
        always_run: true
