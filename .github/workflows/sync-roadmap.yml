name: Sync roadmap

on:
  push:
    branches:
      - development
    paths:
      - docs/ROADMAP.md
      - scripts/sync_roadmap.py
      - .github/workflows/sync-roadmap.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-roadmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Create milestones and assign roadmap issues
        run: python scripts/sync_roadmap.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
