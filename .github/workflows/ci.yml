name: CI

on:
  pull_request:
    branches:
      - development
  push:
    branches:
      - development

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development tools
        run: python -m pip install --editable '.[dev]'

      - name: Check formatting
        run: ruff format --check .

      - name: Run lint checks
        run: ruff check .

      - name: Scan for committed secrets
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run test suite
        run: pytest

      - name: Validate Docker Compose configuration
        run: |
          docker compose config --quiet
          WEB_CHECKER_IMAGE=web-checker-production:validation \
            WEB_CHECKER_PRODUCTION_CONFIG_PATH=/dev/null \
            WEB_CHECKER_PRODUCTION_ENV_PATH=/dev/null \
            docker compose --file compose.production.yaml config --quiet
