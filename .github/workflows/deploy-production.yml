name: Production deployment

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy validated development revision
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'development'
    runs-on:
      - self-hosted
      - linux
      - x64
      - web-checker-production
    timeout-minutes: 30
    environment:
      name: production

    steps:
      - name: Check out the validated merge revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Deploy production
        env:
          DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: >-
          python3 scripts/deploy_production.py
          --revision "$DEPLOY_REVISION"
          --config /etc/web-checker-production/jobs.yaml
          --env-file /etc/web-checker-production/worker.env
