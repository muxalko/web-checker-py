name: web-checker-development

services:
  checker:
    build:
      context: .
      target: development
    command:
      - web-checker
      - --config
      - jobs.example.yaml
      - --database
      - /data/web-checker.db
      - worker
    restart: unless-stopped
    depends_on:
      mailpit:
        condition: service_healthy
      mock-site:
        condition: service_healthy
    environment:
      WEB_CHECKER_SMTP_FROM: alerts@example.test
      WEB_CHECKER_SMTP_HOST: mailpit
      WEB_CHECKER_SMTP_PORT: "1025"
      WEB_CHECKER_SMTP_SECURITY: none
      WEB_CHECKER_SMTP_TO: operator@example.test
    volumes:
      - checker-data:/data

  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_HTTP_PORT:-8025}:8025"
    healthcheck:
      test:
        - CMD
        - /mailpit
        - readyz
      interval: 2s
      timeout: 3s
      retries: 10

  mock-site:
    build:
      context: .
      target: development
    command:
      - python3
      - -m
      - flask
      - --app
      - mock_site.app
      - run
      - --host=0.0.0.0
      - --port=8080
    environment:
      MOCK_SITE_CONTROLS_ENABLED: "true"
    ports:
      - "${MOCK_SITE_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  checker-data:
