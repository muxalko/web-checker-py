services:
  checker:
    build:
      context: .
    command:
      - web-checker
      - --config
      - jobs.example.yaml
      - --database
      - /data/web-checker.db
      - worker
    restart: unless-stopped
    depends_on:
      mock-site:
        condition: service_healthy
    volumes:
      - checker-data:/data

  mock-site:
    build:
      context: .
    command:
      - python3
      - -m
      - flask
      - --app
      - mock_site.app
      - run
      - --host=0.0.0.0
      - --port=8080
    environment:
      MOCK_SITE_CONTROLS_ENABLED: "true"
    ports:
      - "${MOCK_SITE_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  checker-data:
